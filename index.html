<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Nordeste — Cordel</title>
<meta name="description" content="Escute o cordel recitado com batida de pé de serra.">
<meta name="theme-color" content="#efe3c8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23efe3c8'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%231b1410'/%3E%3Cg stroke='%231b1410' stroke-width='5'%3E%3Cpath d='M32 4v12M32 48v12M4 32h12M48 32h12M12 12l8 8M44 44l8 8M52 12l-8 8M20 44l-8 8'/%3E%3C/g%3E%3C/svg%3E">
<style>
  @font-face { font-family: "Rye"; src: url("fonts/rye.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Special Elite"; src: url("fonts/special-elite.woff2") format("woff2"); font-display: swap; }

  :root {
    --papel: #efe3c8;
    --papel-escuro: #e2d2ae;
    --tinta: #1b1410;
    --vermelho: #a8291f;
    --barbante: #8a6a3c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--papel); color: var(--tinta); }
  body {
    min-height: 100vh;
    font-family: "Special Elite", "Courier New", monospace;
    background-image:
      radial-gradient(rgba(27,20,16,.06) 1px, transparent 1.2px),
      radial-gradient(rgba(27,20,16,.04) 1px, transparent 1.2px);
    background-size: 7px 7px, 11px 11px;
    background-position: 0 0, 3px 5px;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 16px 48px;
    overflow-x: hidden;
  }

  /* ---------- varal com folhetos ---------- */
  .varal { width: 100%; max-width: 560px; height: 92px; position: relative; margin-bottom: 4px; }
  .varal svg { width: 100%; height: 100%; display: block; }
  .folheto { transform-origin: top center; animation: balanca 3.2s ease-in-out infinite; }
  .folheto:nth-child(2n) { animation-delay: -1.1s; animation-duration: 3.8s; }
  .folheto:nth-child(3n) { animation-delay: -2s; }
  @keyframes balanca { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  /* ---------- capa do cordel ---------- */
  .capa {
    width: 100%; max-width: 440px;
    background: var(--papel);
    border: 3px solid var(--tinta);
    outline: 1.5px solid var(--tinta); outline-offset: 5px;
    padding: 22px 20px 26px;
    box-shadow: 10px 12px 0 rgba(27,20,16,.18);
    text-align: center;
    position: relative;
  }
  .selo {
    font-size: 12px; letter-spacing: .28em; text-transform: uppercase;
    border-top: 1.5px solid var(--tinta); border-bottom: 1.5px solid var(--tinta);
    padding: 5px 0; margin-bottom: 14px;
  }
  h1 {
    font-family: "Rye", Georgia, serif; font-weight: 400;
    font-size: clamp(40px, 12.5vw, 62px); line-height: .98;
    text-transform: uppercase; letter-spacing: .01em;
  }
  h1 .em { display: block; font-size: .5em; color: var(--vermelho); margin: 0 0 6px; letter-spacing: .1em; }

  .sub { font-size: 15px; letter-spacing: .22em; text-transform: uppercase; margin-top: 10px; }
  .xilo { width: 100%; aspect-ratio: 4 / 3; margin: 16px 0 18px; border: 2.5px solid var(--tinta); background: var(--papel); }
  .xilo svg { width: 100%; height: 100%; display: block; }
  .sol-raios { transform-origin: 300px 150px; animation: gira 40s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .tocando .sol-raios { animation-duration: 8s; }

  /* ---------- tocador ---------- */
  .tocador { display: flex; align-items: center; gap: 14px; text-align: left; }
  .play {
    flex: none; width: 76px; height: 76px; border-radius: 50%;
    background: var(--vermelho); color: var(--papel);
    border: 3px solid var(--tinta); box-shadow: 4px 4px 0 var(--tinta);
    display: grid; place-items: center; cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .play:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--tinta); }
  .play:focus-visible { outline: 3px dashed var(--tinta); outline-offset: 4px; }
  .play svg { width: 34px; height: 34px; }
  .play .i-pause { display: none; }
  .tocando .play .i-play { display: none; }
  .tocando .play .i-pause { display: block; }

  .trilha { flex: 1; min-width: 0; }
  .rotulo { font-size: 14px; margin-bottom: 8px; }
  .corda {
    position: relative; height: 18px; cursor: pointer; touch-action: none;
  }
  .corda::before {
    content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px;
    background: repeating-linear-gradient(115deg, var(--barbante) 0 4px, #b8955c 4px 7px);
    border-radius: 2px;
  }
  .corda .feito {
    position: absolute; left: 0; top: 6px; height: 6px; width: 0%;
    background: var(--tinta); border-radius: 3px;
  }
  .corda .no {
    position: absolute; top: 1px; left: 0%; width: 16px; height: 16px; margin-left: -8px;
    background: var(--papel); border: 3px solid var(--tinta); border-radius: 50%;
  }
  .tempo { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; }

  .verso {
    margin-top: 22px; font-size: 15px; line-height: 1.6;
    border-top: 1.5px dashed var(--tinta); padding-top: 14px;
  }
  .verso b { color: var(--vermelho); font-weight: 400; }

  footer { margin-top: 34px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; text-align: center; }
  footer .orn { font-family: "Rye", serif; font-size: 20px; letter-spacing: .4em; display: block; margin-bottom: 6px; opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .folheto, .sol-raios { animation: none; }
  }
</style>
</head>
<body>

  <div class="varal" aria-hidden="true">
    <svg viewBox="0 0 560 92" preserveAspectRatio="xMidYMin meet">
      <path d="M-10 14 Q280 40 570 14" fill="none" stroke="#8a6a3c" stroke-width="2.5"/>
      <g class="folheto" style="transform-box: fill-box"><rect x="40" y="20" width="44" height="60" fill="#c9433a" stroke="#1b1410" stroke-width="2"/><rect x="47" y="30" width="30" height="22" fill="#efe3c8" stroke="#1b1410" stroke-width="1.5"/><path d="M47 58h30M47 64h22" stroke="#1b1410" stroke-width="2"/></g>
      <g class="folheto" style="transform-box: fill-box"><rect x="130" y="27" width="44" height="60" fill="#e0b84a" stroke="#1b1410" stroke-width="2"/><rect x="137" y="37" width="30" height="22" fill="#efe3c8" stroke="#1b1410" stroke-width="1.5"/><path d="M137 65h30M137 71h18" stroke="#1b1410" stroke-width="2"/></g>
      <g class="folheto" style="transform-box: fill-box"><rect x="226" y="30" width="44" height="60" fill="#5b7a4a" stroke="#1b1410" stroke-width="2"/><rect x="233" y="40" width="30" height="22" fill="#efe3c8" stroke="#1b1410" stroke-width="1.5"/><path d="M233 68h30M233 74h24" stroke="#1b1410" stroke-width="2"/></g>
      <g class="folheto" style="transform-box: fill-box"><rect x="322" y="30" width="44" height="60" fill="#d98a3a" stroke="#1b1410" stroke-width="2"/><rect x="329" y="40" width="30" height="22" fill="#efe3c8" stroke="#1b1410" stroke-width="1.5"/><path d="M329 68h30M329 74h16" stroke="#1b1410" stroke-width="2"/></g>
      <g class="folheto" style="transform-box: fill-box"><rect x="416" y="26" width="44" height="60" fill="#3f5f8a" stroke="#1b1410" stroke-width="2"/><rect x="423" y="36" width="30" height="22" fill="#efe3c8" stroke="#1b1410" stroke-width="1.5"/><path d="M423 64h30M423 70h22" stroke="#1b1410" stroke-width="2"/></g>
      <g class="folheto" style="transform-box: fill-box"><rect x="500" y="19" width="44" height="60" fill="#c9433a" stroke="#1b1410" stroke-width="2"/><rect x="507" y="29" width="30" height="22" fill="#efe3c8" stroke="#1b1410" stroke-width="1.5"/><path d="M507 57h30M507 63h20" stroke="#1b1410" stroke-width="2"/></g>
    </svg>
  </div>

  <main class="capa" id="capa">
    <div class="selo">Literatura de Cordel</div>
    <h1><span class="em">O</span>Nordeste</h1>
    <div class="sub">versos em pé de serra</div>

    <div class="xilo" aria-hidden="true">
      <!-- xilogravura: sol do sertão, mandacarus e serra -->
      <svg viewBox="0 0 400 300">
        <defs>
          <pattern id="hachura" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
            <rect width="6" height="6" fill="#efe3c8"/><rect width="2.6" height="6" fill="#1b1410"/>
          </pattern>
          <pattern id="hachura2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
            <rect width="9" height="9" fill="#efe3c8"/><rect width="1.6" height="9" fill="#1b1410"/>
          </pattern>
        </defs>
        <rect width="400" height="300" fill="#efe3c8"/>
        <!-- sol -->
        <g class="sol-raios" style="transform-origin: 300px 92px">
          <g fill="#1b1410">
            <path d="M300 22 L307 52 L293 52Z"/><path d="M300 162 L307 132 L293 132Z"/>
            <path d="M230 92 L260 85 L260 99Z"/><path d="M370 92 L340 85 L340 99Z"/>
            <path d="M250 42 L275 62 L266 70Z"/><path d="M350 142 L325 122 L334 114Z"/>
            <path d="M350 42 L334 70 L325 62Z"/><path d="M250 142 L266 114 L275 122Z"/>
          </g>
        </g>
        <circle cx="300" cy="92" r="34" fill="#1b1410"/>
        <circle cx="300" cy="92" r="24" fill="#efe3c8"/>
        <circle cx="300" cy="92" r="16" fill="#a8291f"/>
        <!-- urubus -->
        <path d="M70 60 q10 -10 20 0 q10 -10 20 0" fill="none" stroke="#1b1410" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M125 40 q7 -7 14 0 q7 -7 14 0" fill="none" stroke="#1b1410" stroke-width="3" stroke-linecap="round"/>
        <!-- serra ao fundo -->
        <path d="M0 200 L60 150 L105 182 L170 128 L230 186 L280 160 L330 190 L400 150 L400 300 L0 300Z" fill="url(#hachura2)" stroke="#1b1410" stroke-width="3"/>
        <!-- chão -->
        <path d="M0 236 Q100 218 200 232 T400 226 L400 300 L0 300Z" fill="url(#hachura)" stroke="#1b1410" stroke-width="3"/>
        <!-- mandacaru grande -->
        <g fill="#1b1410">
          <path d="M92 270 L92 120 Q92 104 104 104 Q116 104 116 120 L116 270Z"/>
          <path d="M92 196 L70 196 Q58 196 58 184 L58 146 Q58 136 67 136 Q76 136 76 146 L76 178 L92 178Z"/>
          <path d="M116 170 L138 170 Q150 170 150 158 L150 130 Q150 120 141 120 Q132 120 132 130 L132 152 L116 152Z"/>
        </g>
        <g stroke="#efe3c8" stroke-width="2" stroke-linecap="round">
          <path d="M104 116 V262"/><path d="M67 146 V186"/><path d="M141 130 V160"/>
        </g>
        <!-- mandacaru pequeno -->
        <g fill="#1b1410">
          <path d="M250 262 L250 196 Q250 186 258 186 Q266 186 266 196 L266 262Z"/>
          <path d="M250 232 L238 232 Q230 232 230 224 L230 208 Q230 202 236 202 Q242 202 242 208 L242 220 L250 220Z"/>
        </g>
        <!-- moldura interna -->
        <rect x="6" y="6" width="388" height="288" fill="none" stroke="#1b1410" stroke-width="2"/>
      </svg>
    </div>

    <div class="tocador">
      <button class="play" id="play" aria-label="Tocar o cordel">
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
      </button>
      <div class="trilha">
        <div class="rotulo" id="rotulo">Aperte o play e escute</div>
        <div class="corda" id="corda" role="slider" aria-label="Posição do áudio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="feito" id="feito"></div>
          <div class="no" id="no"></div>
        </div>
        <div class="tempo"><span id="atual">0:00</span><span id="total">2:20</span></div>
      </div>
    </div>

    <p class="verso">
      Verso recitado no compasso<br>
      do <b>zabumba</b>, do <b>triângulo</b><br>
      e da <b>sanfona</b> do sertão.
    </p>

    <audio id="audio" src="cordel.mp3" preload="metadata"></audio>
  </main>

  <footer>
    <span class="orn">✦ ✦ ✦</span>
    Trabalho escolar · Literatura de Cordel
  </footer>

<script>
  const audio = document.getElementById('audio');
  const capa = document.getElementById('capa');
  const play = document.getElementById('play');
  const corda = document.getElementById('corda');
  const feito = document.getElementById('feito');
  const no = document.getElementById('no');
  const atual = document.getElementById('atual');
  const total = document.getElementById('total');
  const rotulo = document.getElementById('rotulo');

  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  play.addEventListener('click', () => { audio.paused ? audio.play() : audio.pause(); });
  audio.addEventListener('play', () => { capa.classList.add('tocando'); play.setAttribute('aria-label', 'Pausar'); rotulo.textContent = 'Tocando…'; });
  audio.addEventListener('pause', () => { capa.classList.remove('tocando'); play.setAttribute('aria-label', 'Tocar o cordel'); rotulo.textContent = audio.ended ? 'Fim! Toque de novo' : 'Pausado'; });
  audio.addEventListener('loadedmetadata', () => { total.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', () => {
    const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    feito.style.width = p + '%'; no.style.left = p + '%';
    corda.setAttribute('aria-valuenow', Math.round(p));
    atual.textContent = fmt(audio.currentTime);
  });

  function seek(e) {
    const r = corda.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
    if (audio.duration) audio.currentTime = (x / r.width) * audio.duration;
  }
  let arrastando = false;
  corda.addEventListener('pointerdown', e => { arrastando = true; corda.setPointerCapture(e.pointerId); seek(e); });
  corda.addEventListener('pointermove', e => { if (arrastando) seek(e); });
  corda.addEventListener('pointerup', () => { arrastando = false; });
  corda.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
    if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
  });
</script>
</body>
</html>
